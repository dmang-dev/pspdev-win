name: Build release bundles

# Manually-triggered build of pspdev-win release artifacts.
#
# Produces TWO zips per run:
#
#   pspdev-win-libraries-<gcc>-<ver>.zip   — just the 16 Tier 1 libs.
#                                            For users who already have a
#                                            pspdev install (Linux, macOS,
#                                            WSL) and want the libs on top.
#
#   pspdev-win-<gcc>-<ver>.zip             — toolchain + libs, the full
#                                            "Windows install in 5 minutes"
#                                            artifact. This is the headline
#                                            release.
#
# Optionally creates a unified GitHub Release tagged with the bundle version
# (e.g. `v2`) carrying both zips as assets.
#
# Workflow does not run on push. Releases are curated, not every-commit.
# Trigger from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Bundle version tag (e.g. v2)'
        required: true
        default: 'v0-dev'
      create_release:
        description: 'Create unified GitHub Release with both bundle zips'
        type: boolean
        default: false
      pspdev_ref:
        description: 'pspdev fork ref to build the toolchain from'
        required: false
        default: 'windows-port'
      psp_packages_ref:
        description: 'psp-packages ref to source PSPBUILDs from'
        required: false
        default: 'master'

permissions:
  contents: write  # needed to create releases when create_release=true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240   # ~60-90 min toolchain build + ~30 min libraries on a cold cache

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout pspdev-win
        uses: actions/checkout@v4
        with:
          path: pspdev-win

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          # update: false on purpose — `pacman -Syuu` mid-job can roll
          # forward msys-* runtime DLL ABIs (e.g. libmpc-3 -> libmpc-4)
          # between runs, leaving cached toolchain binaries that link
          # against the OLD DLL name unable to find their deps and
          # failing with `cannot open shared object file`. Stick with
          # whatever the runner image ships. (We separately bundle the
          # required msys-* DLLs into install/bin/ below to make the
          # toolchain self-contained regardless.)
          update: false
          # prepare.sh installs the heavy toolchain build deps via pacman.
          # Here we pre-install only what the bundle script itself needs
          # beyond base-devel (zip/unzip/cmake/python/curl).
          install: >-
            base-devel
            git
            zip
            unzip
            cmake
            curl
            python
            dos2unix

      - name: Resolve pspdev fork commit (for cache key)
        id: pspdev-rev
        shell: bash
        run: |
          commit=$(git ls-remote https://github.com/dmang-dev/pspdev.git \
            "refs/heads/${{ inputs.pspdev_ref }}" | cut -f1)
          if [ -z "$commit" ]; then
            # Maybe it's already a SHA or tag.
            commit="${{ inputs.pspdev_ref }}"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "pspdev commit: $commit"

      # Split restore + save (instead of the combined `actions/cache@v4`) so a
      # successful toolchain build survives a later step's failure. The
      # combined action's post-save is skipped on job failure, so when the
      # bundle step failed we lost 90 minutes of toolchain build on retry.
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: pspdev-win/install
          # `-v2` salt: bumped 2026-05-19 to bust the May-16 cache whose
          # cached install/ links against a libmpc ABI that no longer exists
          # in current MSYS2. New caches include bundled MSYS2 runtime DLLs
          # (see "Bundle MSYS2 runtime DLLs" step) so future ABI drift won't
          # require another bump.
          key: pspdev-toolchain-${{ runner.os }}-${{ steps.pspdev-rev.outputs.commit }}-v2

      - name: Build toolchain (cache miss only)
        id: build-toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: pspdev-win
        run: |
          # MSYS2 was installed by msys2/setup-msys2 — its root is exposed as
          # MSYS2_LOCATION. Pass it explicitly so bootstrap-windows doesn't
          # try to auto-detect C:\msys64 (which doesn't exist on the runner).
          $msys2Root = $env:MSYS2_LOCATION
          if (-not $msys2Root) { $msys2Root = "D:\a\_temp\msys64" }
          Write-Host "Using MSYS2 root: $msys2Root"
          .\bootstrap-windows.ps1 `
            -Msys2Root $msys2Root `
            -PspdevBranch "${{ inputs.pspdev_ref }}"

      - name: Save toolchain cache (even on later failure)
        # Only save when we actually built (cache miss + build succeeded).
        # `if: always()` makes the step run regardless of subsequent job
        # success/failure, so a flaky bundle step doesn't cost us the
        # toolchain build on the next retry.
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.build-toolchain.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: pspdev-win/install
          # `-v2` salt: bumped 2026-05-19 to bust the May-16 cache whose
          # cached install/ links against a libmpc ABI that no longer exists
          # in current MSYS2. New caches include bundled MSYS2 runtime DLLs
          # (see "Bundle MSYS2 runtime DLLs" step) so future ABI drift won't
          # require another bump.
          key: pspdev-toolchain-${{ runner.os }}-${{ steps.pspdev-rev.outputs.commit }}-v2

      - name: Bundle MSYS2 runtime DLLs into install/bin
        # Runs ALWAYS (not just cache-miss) — cached install/ may predate
        # this step's introduction. Re-copies are idempotent; overhead is
        # ~10 MB of file copies, well under the build's noise floor.
        working-directory: pspdev-win
        run: |
          # The 13 MSYS2 runtime DLLs the toolchain actually imports
          # (computed via `objdump -p` over every .exe/.dll in install/
          # bin + install/libexec — full list below). Bundling them into
          # install/bin makes the toolchain portable across MSYS2 versions:
          # if a user installs a fresh MSYS2 that has e.g. libmpc-4 only,
          # our cc1.exe still finds its own libmpc-3 in install/bin and
          # works. Without this, the toolchain breaks whenever MSYS2 rolls
          # an ABI underneath (which it does, occasionally).
          deps="msys-2.0.dll msys-expat-1.dll msys-gcc_s-seh-1.dll
                msys-gmp-10.dll msys-iconv-2.dll msys-intl-8.dll
                msys-lzma-5.dll msys-mpc-3.dll msys-mpfr-6.dll
                msys-ncursesw6.dll msys-stdc++-6.dll msys-z.dll
                msys-zstd-1.dll"
          # MSYS2 root on the GitHub runner is $RUNNER_TEMP/msys64 (the
          # actions setup defaults). /usr/bin maps to MSYS2_ROOT/usr/bin.
          src="/usr/bin"
          missing=0
          for d in $deps; do
            if [ -f "$src/$d" ]; then
              cp -v "$src/$d" install/bin/
            else
              echo "WARN: $src/$d not present in this MSYS2 image" >&2
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing required DLL(s) missing — toolchain will not be portable" >&2
            exit 1
          fi
          echo "--- install/bin/msys-*.dll after bundling ---"
          ls -l install/bin/msys-*.dll | awk '{print $9, $5}'

      - name: Build library bundle
        working-directory: pspdev-win
        run: |
          # Use unix-style $(pwd), not $(pwd -W) — MSYS2 bash's PATH lookup
          # is reliable for unix paths and flaky for Windows-style paths
          # with forward slashes. (Matches how the script is invoked
          # locally per the README.)
          export PSPDEV="$(pwd)/install"
          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV"
          ls "$PSPDEV/bin/" | head -20
          psp-gcc --version
          tools/build-library-bundle.sh \
            --bundle-version "${{ inputs.bundle_version }}" \
            --psp-packages-ref "${{ inputs.psp_packages_ref }}" \
            --output "$(pwd)/dist"

      - name: Determine release artifact names
        id: names
        working-directory: pspdev-win
        run: |
          # Extract psp-gcc version (e.g. "15.2.0") to embed in zip names —
          # matches the libs-bundle filename convention, lets users see at a
          # glance which compiler the artifact was built with.
          gcc_version=$(./install/bin/psp-gcc.exe --version | head -1 | awk '{print $NF}')
          libs_zip="pspdev-win-libraries-${gcc_version}-${{ inputs.bundle_version }}.zip"
          toolchain_zip="pspdev-win-${gcc_version}-${{ inputs.bundle_version }}.zip"
          echo "gcc_version=$gcc_version"   >> "$GITHUB_OUTPUT"
          echo "libs_zip=$libs_zip"         >> "$GITHUB_OUTPUT"
          echo "toolchain_zip=$toolchain_zip" >> "$GITHUB_OUTPUT"
          echo "psp-gcc $gcc_version"
          echo "libs:      dist/$libs_zip"
          echo "toolchain: dist/$toolchain_zip"

      - name: Bundle full toolchain (toolchain + libs)
        working-directory: pspdev-win
        run: |
          # Zip the entire install/ tree — psp-gcc, pspsdk, host tools, AND
          # the libraries that the library-bundle step just installed into
          # install/psp/lib/. This is the "Windows install in 5 minutes"
          # artifact: one extract and the user has everything.
          #
          # cd into install/ so the zip paths are bin/, psp/, lib/, …
          # (matches the layout users get when they extract to $PSPDEV).
          mkdir -p dist
          (cd install && zip -qr "../dist/${{ steps.names.outputs.toolchain_zip }}" .)
          ls -lh "dist/${{ steps.names.outputs.toolchain_zip }}"

      - name: List bundle contents
        working-directory: pspdev-win
        run: |
          ls -lh dist/
          echo "--- libs manifest (libraries.json) ---"
          unzip -p "dist/${{ steps.names.outputs.libs_zip }}" libraries.json | head -200 || true
          echo "--- toolchain top-level dirs ---"
          unzip -l "dist/${{ steps.names.outputs.toolchain_zip }}" | head -20

      - name: Upload library-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pspdev-win-libraries-${{ inputs.bundle_version }}
          path: pspdev-win/dist/${{ steps.names.outputs.libs_zip }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload toolchain-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pspdev-win-${{ inputs.bundle_version }}
          path: pspdev-win/dist/${{ steps.names.outputs.toolchain_zip }}
          if-no-files-found: error
          retention-days: 90

      - name: Create unified GitHub Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.bundle_version }}
          name: pspdev-win ${{ inputs.bundle_version }}
          generate_release_notes: true
          # Both zips on one release page. Users pick: full toolchain
          # (default, what the README recommends) or libraries-only
          # (existing-pspdev-install case).
          files: |
            pspdev-win/dist/${{ steps.names.outputs.libs_zip }}
            pspdev-win/dist/${{ steps.names.outputs.toolchain_zip }}
          fail_on_unmatched_files: true
